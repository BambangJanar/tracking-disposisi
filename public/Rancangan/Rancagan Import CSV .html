<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wireframe Brutalist - Modal Import CSV (Resized)</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap");

      body {
        font-family: "Inter", sans-serif;
        font-weight: 800;
      }

      /* Pola Latar Belakang Titik-titik */
      .bg-dots {
        background-color: #f8fafc;
        background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
        background-size: 24px 24px;
      }

      /* Gaya Brutalist (Garis Tebal) */
      .border-brutal {
        border: 3px solid #000;
      }
      .border-b-brutal {
        border-bottom: 3px solid #000;
      }
      .border-t-brutal {
        border-top: 3px solid #000;
      }

      /* Bayangan diperkecil sedikit agar proporsional dengan modal yang lebih kecil */
      .shadow-brutal {
        box-shadow: 6px 6px 0px 0px #000;
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }
      .shadow-brutal-sm {
        box-shadow: 3px 3px 0px 0px #000;
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }

      /* Efek Hover */
      button:hover.shadow-brutal,
      label:hover.shadow-brutal {
        transform: translate(-2px, -2px);
        box-shadow: 8px 8px 0px 0px #000;
      }
      button:active.shadow-brutal,
      label:active.shadow-brutal {
        transform: translate(3px, 3px);
        box-shadow: 0px 0px 0px 0px #000;
      }

      button:hover.shadow-brutal-sm {
        transform: translate(-1px, -1px);
        box-shadow: 4px 4px 0px 0px #000;
      }
      button:active.shadow-brutal-sm {
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0px 0px #000;
      }
    </style>
  </head>
  <body
    class="text-black h-screen flex items-center justify-center bg-dots p-4"
  >
    <!-- MODAL CONTAINER (Dikecilkan dari max-w-2xl menjadi max-w-xl) -->
    <div
      class="bg-white border-brutal shadow-brutal w-full max-w-xl flex flex-col relative z-10"
    >
      <!-- HEADER MODAL -->
      <div class="flex justify-between items-center px-6 py-4 border-b-brutal">
        <div class="flex items-center gap-3">
          <!-- Ikon Import Hijau -->
          <div class="text-green-600">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 14h-3v-4H9l3.5-3.5L16 12h-3v4z"
              ></path>
            </svg>
          </div>
          <h2 class="text-xl tracking-tight text-black">Import Data Surat</h2>
        </div>
        <!-- Tombol Close (X) -->
        <button
          class="w-8 h-8 border-2 border-black bg-gray-100 rounded-full flex items-center justify-center hover:bg-red-500 hover:text-white transition-colors shadow-brutal-sm"
          aria-label="Tutup Modal"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
            viewBox="0 0 24 24"
          >
            <path d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- BODY MODAL -->
      <!-- Padding dikurangi dari py-8 menjadi py-6, spasi antar elemen dikurangi -->
      <div class="px-6 py-6 space-y-6 bg-white">
        <!-- Step 1: Download Template -->
        <div>
          <div class="flex items-center gap-3 mb-1.5">
            <div
              class="w-7 h-7 rounded-full border-2 border-black bg-green-200 text-green-900 flex items-center justify-center text-xs font-black shadow-brutal-sm"
            >
              1
            </div>
            <h3 class="text-base tracking-tight">Download Template</h3>
          </div>
          <p
            class="text-gray-600 text-xs font-semibold mb-3 ml-10 leading-relaxed"
          >
            Unduh file template CSV, lalu isi dengan data surat Anda. Pastikan
            urutan kolomnya tidak diubah.
          </p>
          <div class="ml-10">
            <button
              class="bg-gray-100 border-2 border-black px-4 py-2 flex items-center gap-2 shadow-brutal-sm hover:bg-gray-200 text-xs transition-transform"
            >
              <svg
                class="w-4 h-4 text-green-700"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"></path>
              </svg>
              Download Template CSV
            </button>
          </div>
        </div>

        <!-- Step 2: Upload File CSV -->
        <div>
          <div class="flex items-center gap-3 mb-1.5">
            <div
              class="w-7 h-7 rounded-full border-2 border-black bg-green-200 text-green-900 flex items-center justify-center text-xs font-black shadow-brutal-sm"
            >
              2
            </div>
            <h3 class="text-base tracking-tight">Upload File CSV</h3>
          </div>
          <p
            class="text-gray-600 text-xs font-semibold mb-3 ml-10 leading-relaxed"
          >
            Upload file CSV yang sudah Anda isi datanya sesuai dengan template
            di atas.
          </p>

          <!-- Area Dropzone -->
          <div class="ml-10">
            <!-- Padding dikurangi dari p-10 menjadi p-6 -->
            <label
              class="block border-[3px] border-black border-dashed bg-green-50 hover:bg-green-100 cursor-pointer p-6 flex flex-col items-center justify-center text-center transition-colors shadow-brutal-sm"
            >
              <input type="file" class="hidden" accept=".csv" />

              <!-- Ikon CSV -->
              <div class="text-green-600 mb-3">
                <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 24 24">
                  <path
                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 13.5c0 .83-.67 1.5-1.5 1.5v2c1.93 0 3.5-1.57 3.5-3.5S13.43 12 11.5 12c-1.1 0-2 .9-2 2s.9 2 2 2v-2.5zm-5 0c0 .83-.67 1.5-1.5 1.5h-1v-5h1c.83 0 1.5.67 1.5 1.5v2zm8.5-2v5h-2v-5h2zM13 9V3.5L18.5 9H13z"
                  ></path>
                </svg>
              </div>
              <span class="text-green-700 text-base mb-1 tracking-tight"
                >Klik untuk pilih file</span
              >
              <span
                class="text-gray-500 text-[10px] font-semibold uppercase tracking-widest"
                >Format: .csv (UTF-8)</span
              >
            </label>
          </div>
        </div>
      </div>

      <!-- FOOTER MODAL -->
      <div class="px-6 py-4 border-t-brutal bg-gray-50 flex justify-end gap-3">
        <!-- Tombol Batal -->
        <button
          class="bg-white border-2 border-black px-5 py-2 text-xs shadow-brutal-sm hover:bg-gray-100 transition-transform"
        >
          Batal
        </button>
        <!-- Tombol Import -->
        <button
          class="bg-green-600 text-white border-2 border-black px-5 py-2 flex items-center gap-2 text-xs shadow-brutal-sm hover:bg-green-500 transition-transform"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            viewBox="0 0 24 24"
          >
            <path
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
            ></path>
          </svg>
          Import Sekarang
        </button>
      </div>
    </div>
  </body>
</html>
