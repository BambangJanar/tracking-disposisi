<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wireframe - Pengaturan Sistem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      .balsamiq-box {
        border: 4px solid #000;
        box-shadow: 6px 6px 0px #000;
        background-color: #fff;
      }
      .balsamiq-input {
        border: 2px solid #000;
        padding: 0.75rem;
        width: 100%;
        outline: none;
        font-weight: 800;
        box-shadow: 3px 3px 0px #000;
      }
      .balsamiq-button {
        border: 2px solid #000;
        box-shadow: 3px 3px 0px #000;
        font-weight: 900;
        background: #fff;
      }
    </style>
  </head>
  <body class="bg-gray-100 flex h-screen overflow-hidden text-gray-900">
    <aside
      class="w-64 bg-white border-r-4 border-black hidden md:flex flex-col z-20 shrink-0"
    >
      <div
        class="h-16 border-b-4 border-black flex items-center justify-center bg-gray-50"
      >
        <h1 class="font-black text-xl">xxxx.xxxx</h1>
      </div>
      <div class="p-4 flex-1 overflow-y-auto font-bold space-y-4 text-sm mt-4">
        <a href="#" class="block px-4 py-2 hover:bg-gray-200">Dashboard</a>
        <a
          href="#"
          class="block px-4 py-2 bg-black text-white border-2 border-black shadow-[2px_2px_0px_#ccc]"
          >Pengaturan Sistem</a
        >
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden relative">
      <div
        class="absolute inset-0 opacity-10 pointer-events-none"
        style="
          background-image: radial-gradient(#000 2px, transparent 2px);
          background-size: 20px 20px;
        "
      ></div>

      <header
        class="h-16 bg-white border-b-4 border-black flex items-center justify-between px-6 z-10 shrink-0 bg-gray-50"
      >
        <h1 class="font-black text-sm md:text-lg">Pengaturan Sistem</h1>
        <div class="font-black text-sm">xxxx xxxx ▼</div>
      </header>

      <div class="flex-1 overflow-y-auto p-6 lg:p-8 z-10">
        <div class="mb-6">
          <h2 class="text-3xl font-black mb-1">Pengaturan Sistem</h2>
          <p class="font-bold text-gray-600 text-sm">
            Kelola pengaturan aplikasi, instansi, dan tanda tangan
          </p>
        </div>

        <div class="balsamiq-box flex flex-col overflow-hidden">
          <!-- Tabs -->
          <div class="flex border-b-4 border-black bg-gray-50">
            <button class="px-6 py-4 font-black border-b-4 border-black -mb-1">
              ⚙️ Aplikasi
            </button>
            <button class="px-6 py-4 font-bold text-gray-500">
              🏢 Instansi
            </button>
            <button class="px-6 py-4 font-bold text-gray-500">
              ✍️ Tanda Tangan
            </button>
          </div>

          <!-- Form Content -->
          <div class="p-6 space-y-6 bg-white">
            <h3 class="font-black text-lg mb-4">Pengaturan Aplikasi</h3>

            <div>
              <label
                class="block text-xs font-black uppercase text-gray-500 mb-2"
                >Nama Aplikasi *</label
              >
              <input
                type="text"
                value="xxxx xxxx xxxx xxxx"
                class="balsamiq-input bg-gray-50"
              />
            </div>

            <div>
              <label
                class="block text-xs font-black uppercase text-gray-500 mb-2"
                >Deskripsi Aplikasi</label
              >
              <textarea rows="3" class="balsamiq-input resize-none bg-gray-50">
xxxx xxxx xxxx</textarea
              >
            </div>

            <div>
              <label
                class="block text-xs font-black uppercase text-gray-500 mb-2"
                >Tema Warna Aplikasi</label
              >
              <div class="flex gap-4 mt-2">
                <div
                  class="w-8 h-8 rounded-full border-4 border-black bg-gray-300"
                ></div>
                <div
                  class="w-8 h-8 rounded-full border-2 border-black bg-gray-400"
                ></div>
                <div
                  class="w-8 h-8 rounded-full border-2 border-black bg-gray-500"
                ></div>
                <div
                  class="w-8 h-8 rounded-full border-2 border-black bg-gray-600"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
