<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wireframe - Manajemen Pengguna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      .balsamiq-box {
        border: 4px solid #000;
        box-shadow: 6px 6px 0px #000;
        background-color: #fff;
      }
      .balsamiq-button {
        border: 2px solid #000;
        box-shadow: 3px 3px 0px #000;
        font-weight: 900;
        background: #fff;
      }
      .balsamiq-badge {
        border: 2px solid #000;
        font-weight: 900;
        padding: 0.25rem 0.75rem;
        text-transform: uppercase;
        font-size: 0.7rem;
        background: #fff;
        box-shadow: 2px 2px 0px #000;
      }
      .wireframe-table th {
        border-bottom: 4px solid #000;
        padding: 1rem;
        text-transform: uppercase;
        font-weight: 900;
        font-size: 0.75rem;
      }
      .wireframe-table td {
        border-bottom: 2px solid #000;
        padding: 1rem;
        font-weight: 600;
        font-size: 0.875rem;
        vertical-align: top;
      }
    </style>
  </head>
  <body class="bg-gray-100 flex h-screen overflow-hidden text-gray-900">
    <aside
      class="w-64 bg-white border-r-4 border-black hidden md:flex flex-col z-20 shrink-0"
    >
      <div
        class="h-16 border-b-4 border-black flex items-center justify-center bg-gray-50"
      >
        <h1 class="font-black text-xl">xxxx.xxxx</h1>
      </div>
      <div class="p-4 flex-1 overflow-y-auto font-bold space-y-4 text-sm mt-4">
        <a href="#" class="block px-4 py-2 hover:bg-gray-200">Dashboard</a>
        <a
          href="#"
          class="block px-4 py-2 bg-black text-white border-2 border-black shadow-[2px_2px_0px_#ccc]"
          >Manajemen User</a
        >
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden relative">
      <div
        class="absolute inset-0 opacity-10 pointer-events-none"
        style="
          background-image: radial-gradient(#000 2px, transparent 2px);
          background-size: 20px 20px;
        "
      ></div>

      <header
        class="h-16 bg-white border-b-4 border-black flex items-center justify-between px-6 z-10 shrink-0 bg-gray-50"
      >
        <h1 class="font-black text-sm md:text-lg">Manajemen Pengguna</h1>
        <div class="font-black text-sm">xxxx xxxx ▼</div>
      </header>

      <div class="flex-1 overflow-y-auto p-6 lg:p-8 z-10">
        <div class="mb-6">
          <h2 class="text-3xl font-black mb-1">Manajemen Pengguna</h2>
          <p class="font-bold text-gray-600 text-sm">
            Kelola pendaftaran, hak akses, dan role pengguna
          </p>
        </div>

        <div class="balsamiq-box overflow-hidden">
          <!-- Tabs -->
          <div class="flex border-b-4 border-black bg-gray-50">
            <button class="px-6 py-4 font-black border-b-4 border-black -mb-1">
              Semua User
            </button>
            <button class="px-6 py-4 font-bold text-gray-500">
              Menunggu
              <span class="bg-black text-white px-2 py-0.5 rounded text-xs ml-1"
                >x</span
              >
            </button>
            <button class="px-6 py-4 font-bold text-gray-500">Aktif</button>
          </div>
          <!-- Table -->
          <div class="overflow-x-auto">
            <table class="w-full text-left wireframe-table bg-white">
              <tr class="bg-gray-100">
                <th>No</th>
                <th>Nama / Email</th>
                <th>Role & Bagian</th>
                <th>Status</th>
                <th class="text-center">Aksi</th>
              </tr>
              <tr>
                <td>1</td>
                <td>
                  <div class="flex items-center">
                    <div
                      class="w-8 h-8 border-2 border-black rounded-full flex items-center justify-center font-black bg-gray-200 mr-3"
                    >
                      x
                    </div>
                    <div>
                      <p class="font-black">xxxx</p>
                      <p class="text-xs font-bold text-gray-500">
                        xxxx@xxxx.com
                      </p>
                    </div>
                  </div>
                </td>
                <td>
                  <p class="font-black">User ✎</p>
                  <p class="text-xs font-bold mt-1">Bagian: -</p>
                </td>
                <td>
                  <span class="balsamiq-badge text-black border-dashed"
                    >Pending</span
                  >
                </td>
                <td class="text-center flex justify-center gap-2">
                  <button class="balsamiq-button px-3 py-1 text-xs">
                    ✓ Terima
                  </button>
                  <button
                    class="balsamiq-button px-3 py-1 text-xs bg-black text-white"
                  >
                    ✕ Tolak
                  </button>
                </td>
              </tr>
            </table>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
