<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wireframe - Master Jenis Surat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      .balsamiq-box {
        border: 4px solid #000;
        box-shadow: 6px 6px 0px #000;
        background-color: #fff;
      }
      .balsamiq-button {
        border: 2px solid #000;
        box-shadow: 3px 3px 0px #000;
        font-weight: 900;
        background: #fff;
      }
      .wireframe-table th {
        border-bottom: 4px solid #000;
        padding: 1rem;
        text-transform: uppercase;
        font-weight: 900;
        font-size: 0.75rem;
      }
      .wireframe-table td {
        border-bottom: 2px solid #000;
        padding: 1rem;
        font-weight: 600;
        font-size: 0.875rem;
        vertical-align: middle;
      }
    </style>
  </head>
  <body class="bg-gray-100 flex h-screen overflow-hidden text-gray-900">
    <aside
      class="w-64 bg-white border-r-4 border-black hidden md:flex flex-col z-20 shrink-0"
    >
      <div
        class="h-16 border-b-4 border-black flex items-center justify-center bg-gray-50"
      >
        <h1 class="font-black text-xl">xxxx.xxxx</h1>
      </div>
      <div class="p-4 flex-1 overflow-y-auto font-bold space-y-4 text-sm mt-4">
        <a href="#" class="block px-4 py-2 hover:bg-gray-200">Dashboard</a>
        <a
          href="#"
          class="block px-4 py-2 bg-black text-white border-2 border-black shadow-[2px_2px_0px_#ccc]"
          >Master Jenis Surat</a
        >
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden relative">
      <div
        class="absolute inset-0 opacity-10 pointer-events-none"
        style="
          background-image: radial-gradient(#000 2px, transparent 2px);
          background-size: 20px 20px;
        "
      ></div>

      <header
        class="h-16 bg-white border-b-4 border-black flex items-center justify-between px-6 z-10 shrink-0 bg-gray-50"
      >
        <h1 class="font-black text-sm md:text-lg">Master Jenis Surat</h1>
        <div class="font-black text-sm">xxxx xxxx ▼</div>
      </header>

      <div class="flex-1 overflow-y-auto p-6 lg:p-8 z-10">
        <div
          class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4"
        >
          <div>
            <h2 class="text-3xl font-black mb-1">Master Jenis Surat</h2>
            <p class="font-bold text-gray-600 text-sm">
              Kelola jenis-jenis surat
            </p>
          </div>
          <button
            class="balsamiq-button px-5 py-3 text-sm uppercase bg-black text-white"
          >
            + Tambah Jenis
          </button>
        </div>

        <div class="balsamiq-box overflow-x-auto">
          <table class="w-full text-left wireframe-table bg-white">
            <tr class="bg-gray-100">
              <th class="w-16">No</th>
              <th>Nama Jenis</th>
              <th>Keterangan</th>
              <th class="text-center w-24">Aksi</th>
            </tr>
            <tr>
              <td>1</td>
              <td><p class="font-black">Surat Masuk</p></td>
              <td>
                <p class="font-bold text-gray-600">
                  Surat yang diterima dari luar
                </p>
              </td>
              <td class="text-center flex justify-center gap-2">
                <button class="balsamiq-button px-2 py-1 text-xs">✎</button>
                <button class="balsamiq-button px-2 py-1 text-xs">🗑</button>
              </td>
            </tr>
          </table>
        </div>
      </div>
    </main>
  </body>
</html>
