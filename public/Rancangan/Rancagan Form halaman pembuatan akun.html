<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wireframe - Buat Akun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      .balsamiq-box {
        border: 2px solid #000;
        box-shadow: 4px 4px 0px #000;
        background-color: #fff;
      }
      .balsamiq-button {
        border: 2px solid #000;
        box-shadow: 4px 4px 0px #000;
        transition: all 0.1s;
      }
      .balsamiq-button:active {
        box-shadow: 0px 0px 0px #000;
        transform: translate(4px, 4px);
      }
    </style>
  </head>
  <body
    class="bg-white min-h-screen flex items-center justify-center text-gray-900"
  >
    <div class="flex flex-col md:flex-row w-full min-h-screen">
      <!-- Kiri: Banner -->
      <div
        class="hidden md:flex md:w-1/2 bg-blue-600 flex-col items-center justify-center p-12 border-r-4 border-black relative text-white"
      >
        <div
          class="absolute inset-0 opacity-20"
          style="
            background-image: radial-gradient(#fff 2px, transparent 2px);
            background-size: 20px 20px;
          "
        ></div>

        <div class="relative z-10 flex flex-col items-center text-center">
          <div
            class="balsamiq-box px-8 py-6 mb-8 text-blue-600 flex items-center justify-center"
          >
            <svg class="w-16 h-16" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
              />
            </svg>
          </div>
          <h1 class="text-4xl font-black mb-4">Bergabung Sekarang</h1>
          <p class="font-medium max-w-md leading-relaxed">
            Daftarkan diri Anda untuk mulai mengelola disposisi surat dengan
            mudah dan efisien.
          </p>
        </div>
      </div>

      <!-- Kanan: Form Register -->
      <div
        class="w-full md:w-1/2 flex items-center justify-center p-8 bg-white"
      >
        <div class="w-full max-w-md">
          <div class="mb-10">
            <h2 class="text-4xl font-black mb-2">Buat Akun Baru</h2>
            <p class="text-gray-600 font-medium">
              Lengkapi data diri Anda di bawah ini.
            </p>
          </div>

          <form class="space-y-6">
            <div>
              <label class="block font-bold mb-2 text-sm">Nama Lengkap</label>
              <div class="balsamiq-box flex items-center px-4 py-3">
                <svg
                  class="w-5 h-5 text-gray-800 mr-3"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                  ></path>
                </svg>
                <input
                  type="text"
                  placeholder="xxxx"
                  class="w-full bg-transparent outline-none font-medium text-sm"
                />
              </div>
            </div>

            <div>
              <label class="block font-bold mb-2 text-sm">Email Instansi</label>
              <div class="balsamiq-box flex items-center px-4 py-3 bg-blue-50">
                <svg
                  class="w-5 h-5 text-gray-800 mr-3"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                  ></path>
                </svg>
                <input
                  type="email"
                  value="xxxx"
                  class="w-full bg-transparent outline-none font-bold text-sm text-gray-800"
                />
              </div>
            </div>

            <div>
              <label class="block font-bold mb-2 text-sm">Password</label>
              <div class="balsamiq-box flex items-center px-4 py-3 bg-gray-50">
                <svg
                  class="w-5 h-5 text-gray-800 mr-3"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                  ></path>
                </svg>
                <input
                  type="password"
                  value="xxxx"
                  class="w-full bg-transparent outline-none font-medium text-sm tracking-widest"
                />
                <svg
                  class="w-5 h-5 text-gray-800 ml-3 cursor-pointer"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  ></path>
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                  ></path>
                </svg>
              </div>
              <p class="text-xs font-semibold text-gray-500 mt-2">
                Minimal 6 karakter
              </p>
            </div>

            <div class="pt-2">
              <button
                type="button"
                class="balsamiq-button w-full font-black py-4 bg-blue-600 text-white flex items-center justify-center text-sm uppercase tracking-wide cursor-pointer"
              >
                <svg
                  class="w-5 h-5 mr-2"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                  />
                </svg>
                Daftar Sekarang
              </button>
            </div>

            <div class="text-center mt-6">
              <p class="text-sm font-semibold">
                Sudah punya akun?
                <a
                  href="#"
                  class="text-blue-600 font-bold underline decoration-2 underline-offset-4"
                  >Login disini</a
                >
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
